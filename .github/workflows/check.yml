name: Check
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
        working-directory: chat-api
      - run: node --check docs/evidence/app.js
      - run: node --check docs/projects/case.js
      - run: node --check docs/tour/app.js
